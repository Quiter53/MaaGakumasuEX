name: Build and verify Windows package
# Verifies the portable Windows package in a real Windows session: unpacks it, launches the
# packaged program with --ui-verify to capture native window screenshots (PrintWindow) and a
# JSON report, checks the configuration is saved, and runs the native UI test suites against
# the unpacked package. With release_tag it verifies that published Release asset byte for byte;
# otherwise it builds and packages this commit on the pinned v2.1.5 runtime baseline.
# It never creates releases, changes tags or touches main; publishing stays a manual step.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Verify this published Release (e.g. v2.2.0) instead of building
        type: string
        default: ''
      run_ui_tests:
        description: Run native UI test suites
        type: boolean
        default: true
      inject_failure:
        description: Inject a failing assertion into the main verification (proves the run turns red)
        type: boolean
        default: false
  push:
    branches: [pre]
    paths:
      - 'native-ui/**'
      - 'tests/**'
      - 'tools/build_ex_release.py'
      - 'tools/prepare_runtime_baseline.py'
      - '.github/workflows/windows-package.yml'
permissions:
  contents: read
concurrency:
  group: windows-package-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: 1
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download published package
        if: ${{ inputs.release_tag != '' }}
        run: |
          $stage = "$env:RUNNER_TEMP\stage"
          New-Item -ItemType Directory $stage | Out-Null
          gh release download $env:RELEASE_TAG -R $env:GITHUB_REPOSITORY -D $stage -p '*-win-x64-portable.zip' -p '*-win-x64-portable.zip.sha256'
          $zip = Get-ChildItem "$stage\*-win-x64-portable.zip" | Select-Object -First 1
          "PACKAGE_NAME=$($zip.BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build native core (win-x64)
        if: ${{ inputs.release_tag == '' }}
        run: dotnet build native-ui/MFAAvalonia/MFAAvalonia.csproj -c Release -r win-x64

      - name: Prepare runtime baseline (pinned v2.1.5 digest)
        if: ${{ inputs.release_tag == '' }}
        run: python tools/prepare_runtime_baseline.py --tag v2.1.5 --output "$env:RUNNER_TEMP\runtime-baseline"

      - name: Package portable build
        if: ${{ inputs.release_tag == '' }}
        run: |
          $version = (Get-Content assets/interface.json -Raw | ConvertFrom-Json).version
          $name = "MaaGakumasuEX-$version-win-x64-portable"
          python tools/build_ex_release.py --prerelease --runtime "$env:RUNNER_TEMP\runtime-baseline" --ui-core native-ui/MFAAvalonia/bin/Release/net10.0/win-x64/MFAAvalonia.Core.dll --output "$env:RUNNER_TEMP\stage\$name"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "PACKAGE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Use a 1920x1080 display
        # Hosted runners start at 1024x768, which clamps the 1280x800 and 1600x1000 tour windows.
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Warning "Set-DisplayResolution failed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Verify archive and launch packaged program in a real window
        run: |
          $zip = "$env:RUNNER_TEMP\stage\$env:PACKAGE_NAME.zip"
          $expected = (Get-Content "$zip.sha256").Split(' ')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "sha256 mismatch $expected $actual" }
          "Package $env:PACKAGE_NAME sha256 $actual"
          $run = "$env:RUNNER_TEMP\launch"
          Expand-Archive $zip $run
          Get-Content "$run\PORTABLE_BUILD.json"
          $shots = "$env:RUNNER_TEMP\ui-verify"
          New-Item -ItemType Directory $shots | Out-Null
          function Invoke-Verify([string]$dir, [string]$out, [string[]]$extra) {
            New-Item -ItemType Directory $out -Force | Out-Null
            $p = Start-Process "$dir\MaaGakumasu.exe" -ArgumentList (@('--ui-verify', $out, '--ui-verify-exit') + $extra) -PassThru -WorkingDirectory $dir
            $null = $p.Handle  # keep the handle so ExitCode is available after exit
            if (-not $p.WaitForExit(900000)) { Stop-Process $p -Force; throw "verification in $out did not finish" }
            if (-not (Test-Path "$out\report.json")) { throw "verification in $out wrote no report (exit code $($p.ExitCode))" }
            return @{ Code = $p.ExitCode; Report = (Get-Content "$out\report.json" -Raw | ConvertFrom-Json) }
          }

          # Self-test: an injected failing assertion must produce exit code 1 and result "fail".
          $selfDir = "$env:RUNNER_TEMP\selftest"
          Expand-Archive $zip $selfDir
          $self = Invoke-Verify $selfDir "$shots\self-test" @('--ui-verify-inject-failure')
          "self-test exit=$($self.Code) result=$($self.Report.result)"
          if ($self.Code -ne 1 -or $self.Report.result -ne 'fail') { throw "verifier does not fail on an injected failure (exit $($self.Code), result $($self.Report.result))" }

          $inject = if ('${{ inputs.inject_failure }}' -eq 'true') { @('--ui-verify-inject-failure') } else { @() }
          foreach ($pass in 1, 2) {
            # The second launch reuses the configuration written by the first (restart check).
            # Launch 1 also drives the UI with real OS input (SendInput); launch 2 is the plain restart check.
            $extra = if ($pass -eq 1) { @('--ui-verify-interactive') + $inject } else { @() }
            $r = Invoke-Verify $run "$shots\launch-$pass" $extra
            $r.Report | ConvertTo-Json -Depth 6 | Select-Object -First 200
            if ($r.Code -ne 0 -or $r.Report.result -ne 'pass') {
              $r.Report.failedChecks | Format-List | Out-String | Write-Host
              $r.Report.errors | Select-Object -First 20 | Write-Host
              throw "launch $pass failed verification (exit $($r.Code), result $($r.Report.result))"
            }
            if (-not (Test-Path "$run\config\config.json")) { throw "config not saved after launch $pass" }
          }
          $config = Get-Content "$run\config\config.json" -Raw | ConvertFrom-Json
          if ($config.EnablePrereleaseUpdates) { throw "package defaults to prerelease updates" }
          # Runner logs hold no account data; kept with the screenshots for diagnosis only.
          Copy-Item "$run\debug" "$shots\debug-logs" -Recurse -ErrorAction SilentlyContinue

      - name: Native UI test suites
        if: ${{ github.event_name == 'push' || inputs.run_ui_tests }}
        run: |
          # Suites write into their root, and CardRulesUi starts from the built-in rule defaults,
          # so they run on a copy of the unpacked package without the shipped rules file.
          $root = "$env:RUNNER_TEMP\ui-fixture"
          Copy-Item "$env:RUNNER_TEMP\launch" $root -Recurse
          Remove-Item "$root\config\card_rules.json"
          $failed = @()
          dotnet run --project tests/CardRulesUi -c Release -- $root "$env:RUNNER_TEMP\ui-tests\rules" --rules-only; if ($LASTEXITCODE) { $failed += 'CardRulesUi' }
          dotnet run --project tests/DrinkUi -c Release -- $env:GITHUB_WORKSPACE $root; if ($LASTEXITCODE) { $failed += 'DrinkUi' }
          dotnet run --project tests/CardListUi -c Release -- $root; if ($LASTEXITCODE) { $failed += 'CardListUi' }
          dotnet run --project tests/LiquidBoardTests -c Release; if ($LASTEXITCODE) { $failed += 'LiquidBoardTests' }
          dotnet run --project tests/ConfigSaveTests -c Release; if ($LASTEXITCODE) { $failed += 'ConfigSaveTests' }
          dotnet run --project tests/native_release_policy/ReleasePolicyTests.csproj -c Release; if ($LASTEXITCODE) { $failed += 'ReleasePolicy' }
          dotnet build tests/NativeShots -c Release
          if ($LASTEXITCODE) { throw 'NativeShots build failed' }
          $shotRoot = "$env:GITHUB_WORKSPACE\tests\NativeShots\bin\Release\net10.0"
          Copy-Item "$env:GITHUB_WORKSPACE\assets\*" $shotRoot -Recurse -Force
          New-Item -ItemType Directory "$shotRoot\agent\custom" -Force | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\agent\custom\drink_catalog.json" "$shotRoot\agent\custom\drink_catalog.json"
          @{
            'UI.HasCompletedFirstUseTutorial' = $true
            'AnnouncementInfo.DoNotShowAgain' = $true
            'EnableAutoUpdateResource' = $false
            'EnableAutoUpdateMFA' = $false
            'EnableCheckVersion' = $false
          } | ConvertTo-Json | Set-Content "$shotRoot\config\config.json" -Encoding utf8
          dotnet run --project tests/NativeShots -c Release --no-build -- $shotRoot "$env:RUNNER_TEMP\ui-tests\task-options" taskopts
          if ($LASTEXITCODE) { $failed += 'TaskOptions' }
          dotnet run --project tests/NativeShots -c Release --no-build -- $shotRoot "$env:RUNNER_TEMP\ui-tests\round4" round4
          if ($LASTEXITCODE) { $failed += 'ScaleAndDrag' }
          dotnet run --project tests/NativeShots -c Release --no-build -- $shotRoot "$env:RUNNER_TEMP\ui-tests\round5" round5
          if ($LASTEXITCODE) { $failed += 'OptionsAndSurfaces' }
          if ($failed.Count) { throw "failed: $($failed -join ', ')" }

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release_tag == '' }}
        with:
          name: windows-package
          path: |
            ${{ runner.temp }}/stage/*.zip
            ${{ runner.temp }}/stage/*.sha256
            ${{ runner.temp }}/stage/*.files.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification
          path: |
            ${{ runner.temp }}/ui-verify
            ${{ runner.temp }}/ui-tests
          retention-days: 7
