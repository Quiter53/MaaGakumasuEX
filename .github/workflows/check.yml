name: EX resource check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  resource:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q agent
      - run: python tools/ci/check_resource.py assets/resource/base/
